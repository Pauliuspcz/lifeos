server:
  port: 8082
spring:
  application:
    name: progress-service
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: password
    url: jdbc:postgresql://localhost:5434/progress_db
  jpa:
    generate-ddl: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:lifeos}
    password: ${RABBITMQ_PASSWORD:lifeos_dev}
