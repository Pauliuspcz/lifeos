server:
  port: 8082

spring:
  application:
    name: progress-service
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        format: YAML
      discovery:
        prefer-ip-address: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:${PROGRESS_DB_PORT:5434}/${PROGRESS_DB_NAME:progress_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:lifeos}
    password: ${RABBITMQ_PASSWORD:lifeos_dev}

app:
  jwt:
    issuer: ${JWT_ISSUER:lifeos-auth}
    public-key: ${JWT_PUBLIC_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  goal-service:
    url: ${GOAL_SERVICE_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

resilience4j:
  circuitbreaker:
    instances:
      goal:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
