server:
  port: 8082
spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        format: YAML
      discovery:
        prefer-ip-address: true
  application:
    name: progress-service
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    url: jdbc:postgresql://localhost:${PROGRESS_DB_PORT:5434}/${PROGRESS_DB_NAME:progress_db}
  jpa:
    generate-ddl: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:lifeos}
    password: ${RABBITMQ_PASSWORD:lifeos_dev}

app:
  jwt:
    issuer: ${JWT_ISSUER:lifeos-auth}
    public-key: ${JWT_PUBLIC_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  goal-service:
    url: ${GOAL_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"