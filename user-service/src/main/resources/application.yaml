server:
  port: 8080
spring:
  application:
    name: user-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: password
    url: jdbc:postgresql://localhost:5432/user_db
  jpa:
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
app:
  jwt:
    access-expiration-minutes: 60
    refresh-expiration-days: 30
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
  google:
    client-id: 50962000707-9k6o5mjgi5pkqioakhl9chohu61a99oc.apps.googleusercontent.com
