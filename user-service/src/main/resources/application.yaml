server:
  port: 8080
spring:
  application:
    name: user-service
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        format: YAML
      discovery:
        prefer-ip-address: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:${USER_DB_PORT:5432}/${USER_DB_NAME:user_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
app:
  jwt:
    issuer: ${JWT_ISSUER:lifeos-auth}
    access-expiration-minutes: 60
    refresh-expiration-days: 30
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  cors:
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: "health,info"