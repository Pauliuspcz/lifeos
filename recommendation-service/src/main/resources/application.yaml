server:
  port: 8084
spring:
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        format: YAML
      discovery:
        prefer-ip-address: true
  application:
    name: recommendation-service

management:
  endpoints:
    web:
      exposure:
        include: "health, info"

app:
  open-meteo:
    url: ${OPEN_METEO_URL:https://api.open-meteo.com}
    connect-timeout: 2s
    read-timeout: 3s
  weather:
    cache:
      fresh-ttl: 10m
      stale-max: 3h
      max-entries: 1000
    rating:
      heavy-precipitation-mm: 1.0
      poor-wind-kmh: 40
      ok-wind-kmh: 25
      poor-cold-feels-like: -10
      poor-hot-feels-like: 32
      ok-cold-feels-like: 0
      ok-hot-feels-like: 27
      ice-risk-min-temp: -2
      ice-risk-max-temp: 2