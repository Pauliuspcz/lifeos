services:
  user-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${USER_DB_PORT}:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build: ./user-service
    depends_on:
      consul-importer:
        condition: service_completed_successfully
      user-db:
        condition: service_healthy
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SPRING_CLOUD_CONSUL_HOST: "consul"
      TZ: Europe/Oslo

  goal-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${GOAL_DB_NAME}
    ports:
      - "${GOAL_DB_PORT}:5432"
    volumes:
      - goal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${GOAL_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  goal-service:
    build: ./goal-service
    depends_on:
      consul-importer:
        condition: service_completed_successfully
      goal-db:
        condition: service_healthy
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_DATASOURCE_URL: jdbc:postgresql://goal-db:5432/${GOAL_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SPRING_CLOUD_CONSUL_HOST: "consul"
      TZ: Europe/Oslo

  progress-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${PROGRESS_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PROGRESS_DB_PORT}:5432"
    volumes:
      - progress-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PROGRESS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  progress-service:
    build: ./progress-service
    depends_on:
      consul-importer:
        condition: service_completed_successfully
      progress-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://progress-db:5432/${PROGRESS_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GOAL_SERVICE_URL: http://goal-service:8081
      SPRING_CLOUD_CONSUL_HOST: "consul"
      TZ: Europe/Oslo

  report-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${REPORT_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${REPORT_DB_PORT}:5432"
    volumes:
      - "report-db-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${REPORT_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  report-service:
    build: ./report-service
    depends_on:
      consul-importer:
        condition: service_completed_successfully
      report-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://report-db:5432/${REPORT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_CLOUD_CONSUL_HOST: "consul"
      TZ: Europe/Oslo

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  consul:
    image: hashicorp/consul:2.0.0
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command:
      agent -dev -node=lifeos -client=0.0.0.0

  consul-importer:
    build: ./consul
    depends_on:
      - consul


  gateway:
    container_name: gateway
    build:
      context: ./gateway
    environment:
      SPRING_CLOUD_CONSUL_HOST: "consul"
    ports:
      - "8100:8100"
    depends_on:
      - consul

volumes:
  user-db-data:
  goal-db-data:
  progress-db-data:
  report-db-data:
