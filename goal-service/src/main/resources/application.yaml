server:
  port: 8081

spring:
  application:
    name: goal-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${GOAL_DB_PORT:5433}/${GOAL_DB_NAME:goal_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
